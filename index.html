<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spireCRM - Enterprise SaaS Platform</title>
    <style>
      /* Ensure zero white screen flicker during HTML/JS boot & enable smooth vertical scrolling */
      html, body {
        background-color: #09090b !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI Variable', 'Inter', 'Segoe UI', system-ui, sans-serif;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      #root {
        min-height: 100%;
      }
      /* Abstract Dynamic Loader Animations with Zero Overlap */
      @keyframes spireSpinOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spireSpinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes spireFloatLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(6,182,212,0.35)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(192,38,211,0.55)); }
      }
      .spire-boot-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: #09090b;
        position: relative;
        overflow: hidden;
      }
      .spire-glow-bg {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(192,38,211,0.18) 0%, rgba(6,182,212,0.14) 45%, rgba(9,9,11,0) 70%);
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
      }
      .spire-loader-wrapper {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spire-orbit-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #c026d3;
        border-right-color: #22d3ee;
        animation: spireSpinOrbit 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        box-shadow: 0 0 15px rgba(192,38,211,0.2);
      }
      .spire-orbit-inner {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #06b6d4;
        border-left-color: #a855f7;
        animation: spireSpinReverse 1.2s linear infinite;
        box-shadow: 0 0 12px rgba(6,182,212,0.2);
      }
      .spire-brand-icon {
        width: 44px;
        height: 44px;
        position: relative;
        z-index: 10;
        animation: spireFloatLogo 2.4s ease-in-out infinite;
      }
      .spire-brand-title {
        margin-top: 28px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #ffffff;
      }
      .spire-brand-crm {
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .spire-brand-sub {
        margin-top: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: #a1a1aa;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- High-End SpireCRM Boot Loader with Perfect Ring-to-Logo Spacing -->
      <div class="spire-boot-container">
        <div class="spire-glow-bg"></div>
        <div class="spire-loader-wrapper">
          <div class="spire-orbit-outer"></div>
          <div class="spire-orbit-inner"></div>
          <svg class="spire-brand-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bootPurple" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#c026d3" />
                <stop offset="100%" stopColor="#7e22ce" />
              </linearGradient>
              <linearGradient id="bootCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#22d3ee" />
                <stop offset="100%" stopColor="#0284c7" />
              </linearGradient>
            </defs>
            <path d="M 22 25 L 48 10 L 48 30 L 36 38 L 36 82 L 48 90 L 48 110 L 22 95 Z" fill="url(#bootPurple)" />
            <path d="M 98 25 L 72 10 L 72 30 L 84 38 L 84 82 L 72 90 L 72 110 L 98 95 Z" fill="url(#bootCyan)" />
            <rect x="50" y="50" width="8" height="8" rx="2" fill="#e0e7ff" />
            <rect x="62" y="50" width="8" height="8" rx="2" fill="#22d3ee" />
            <rect x="62" y="62" width="8" height="8" rx="2" fill="#06b6d4" />
            <rect x="50" y="62" width="8" height="8" rx="2" fill="#c026d3" />
          </svg>
        </div>
        <div class="spire-brand-title">Spire<span class="spire-brand-crm">CRM</span></div>
        <div class="spire-brand-sub">Enterprise Workspace Initializing</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
